[package]
name = "forja-wasm"
version = "0.9.4"
edition = "2021"
description = "Forja compiler core compiled to WebAssembly"
authors = ["forja-lang"]
license = "GPL-3.0-or-later"
repository = "https://github.com/forja-lang/forja"
homepage = "https://github.com/forja-lang/forja"
documentation = "https://docs.rs/forja-wasm"
readme = "README.md"
keywords = ["forja", "wasm", "compiler", "playground"]
categories = ["wasm", "compilers"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

forja = { path = "../.." }

[package.metadata]
# F2-T2: habilitar wasm-opt para reducir el tamaño del binario.
# Los flags habilitan las features modernas de wasm que genera LLVM
# (bulk-memory, nontrapping-float-to-int, sign-ext).
wasm-opt = ["--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "-O3"]
